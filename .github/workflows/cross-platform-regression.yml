name: Cross-Platform C C++ Regression

on:
  push:
    branches:
      - main
      - branch2
      - branch3_variableAdjust
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.linkage }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        linkage:
          - static
          - shared

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.linkage }}" = "shared" ]; then
            SHARED=ON
          else
            SHARED=OFF
          fi

          cmake -S . -B build \
            -DMYCONTROLLER_BUILD_SHARED=${SHARED} \
            -DMYCONTROLLER_BUILD_TESTS=ON \
            -DMYCONTROLLER_BUILD_PC_CONTROL=ON \
            -DMYCONTROLLER_WARNINGS_AS_ERRORS=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Python syntax check
        run: python -m py_compile tools/pc_control/fuzzy_modbus_control.py
